<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <!-- Rehearsal AI Mascot: Friendly AI Rehearsal Bot with headphone/curtain braces ears -->
  <defs>
    <linearGradient id="mascotBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="mascotScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Floating Antenna with Sound Wave Spark -->
  <line x1="100" y1="46" x2="100" y2="28" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="22" r="7" fill="#06b6d4"/>
  <!-- Head Outer Shell -->
  <rect x="42" y="44" width="116" height="96" rx="28" fill="url(#mascotBody)" stroke="#60a5fa" stroke-width="4"/>
  <!-- Headphone / Curly Bracket Ears -->
  <path d="M34 78 C28 84, 28 98, 34 104 L38 104 L38 78 Z" fill="#06b6d4"/>
  <path d="M166 78 C172 84, 172 98, 166 104 L162 104 L162 78 Z" fill="#06b6d4"/>
  <!-- Face Screen -->
  <rect x="54" y="58" width="92" height="68" rx="18" fill="url(#mascotScreen)"/>
  <!-- Friendly Glowing Eyes -->
  <ellipse cx="78" cy="88" rx="9" ry="12" fill="#38bdf8"/>
  <circle cx="81" cy="84" r="4" fill="#ffffff"/>
  <ellipse cx="122" cy="88" rx="9" ry="12" fill="#38bdf8"/>
  <circle cx="125" cy="84" r="4" fill="#ffffff"/>
  <!-- Voice Wave Smile -->
  <path d="M88 108 Q100 118 112 108" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Floating Collar / Body hint -->
  <path d="M70 148 C70 142 84 140 100 140 C116 140 130 142 130 148 L140 178 C140 185 124 190 100 190 C76 190 60 185 60 178 Z" fill="#2563eb" opacity="0.85"/>
</svg>

