<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%">
  <!-- Crown: ornate shield topped with a royal crown, deep purple/gold -->
  <defs>
    <linearGradient id="purpleShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="50%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="royalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
  </defs>
  <!-- Royal Purple Wings with Gold Edges -->
  <path d="M125 150 L5 170 L55 240 L0 280 L75 350 L155 310 Z" fill="#3b0764" stroke="url(#royalGold)" stroke-width="6"/>
  <path d="M387 150 L507 170 L457 240 L512 280 L437 350 L357 310 Z" fill="#3b0764" stroke="url(#royalGold)" stroke-width="6"/>
  <!-- Ornate Shield Base -->
  <path d="M256 120 L400 170 L380 370 C380 430 256 490 256 490 C256 490 132 430 132 370 L112 170 Z" fill="url(#purpleShield)" stroke="url(#royalGold)" stroke-width="14" stroke-linejoin="round"/>
  <!-- Ornate Royal Crown Topper -->
  <g transform="translate(0, 0)">
    <path d="M180 130 L160 50 L215 90 L256 25 L297 90 L352 50 L332 130 Z" fill="url(#royalGold)" stroke="#fef9c3" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="160" cy="45" r="8" fill="#e879f9"/>
    <circle cx="256" cy="20" r="10" fill="#e879f9"/>
    <circle cx="352" cy="45" r="8" fill="#e879f9"/>
    <rect x="200" y="115" width="112" height="15" rx="5" fill="#fef08a"/>
  </g>
  <!-- Shield Emblem: Golden Laurel & Center Gem -->
  <circle cx="256" cy="275" r="32" fill="#c084fc" stroke="url(#royalGold)" stroke-width="8"/>
  <path d="M185 340 L256 400 L327 340" stroke="url(#royalGold)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <polygon points="256,255 272,275 256,295 240,275" fill="#ffffff"/>
</svg>

