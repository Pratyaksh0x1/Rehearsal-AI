<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%">
  <defs>
    <radialGradient id="swordsBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b1d11"/>
      <stop offset="60%" stop-color="#231008"/>
      <stop offset="100%" stop-color="#0f0502"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="80%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="laurelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring with Gold Metallic Gradient -->
  <circle cx="256" cy="256" r="230" fill="url(#swordsBg)" stroke="url(#goldRim)" stroke-width="16" />
  <circle cx="256" cy="256" r="210" stroke="#f59e0b" stroke-width="4" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Laurel Wreath -->
  <g fill="none" stroke="url(#laurelGrad)" stroke-width="10" stroke-linecap="round">
    <path d="M120 280 C110 350 160 410 230 430" />
    <path d="M392 280 C402 350 352 410 282 430" />
  </g>
  <!-- Laurel Leaves -->
  <g fill="url(#laurelGrad)" opacity="0.9">
    <ellipse cx="125" cy="260" rx="14" ry="8" transform="rotate(-30 125 260)"/>
    <ellipse cx="115" cy="305" rx="14" ry="8" transform="rotate(-15 115 305)"/>
    <ellipse cx="125" cy="350" rx="14" ry="8" transform="rotate(10 125 350)"/>
    <ellipse cx="155" cy="390" rx="14" ry="8" transform="rotate(35 155 390)"/>
    <ellipse cx="200" cy="420" rx="14" ry="8" transform="rotate(55 200 420)"/>

    <ellipse cx="387" cy="260" rx="14" ry="8" transform="rotate(30 387 260)"/>
    <ellipse cx="397" cy="305" rx="14" ry="8" transform="rotate(15 397 305)"/>
    <ellipse cx="387" cy="350" rx="14" ry="8" transform="rotate(-10 387 350)"/>
    <ellipse cx="357" cy="390" rx="14" ry="8" transform="rotate(-35 357 390)"/>
    <ellipse cx="312" cy="420" rx="14" ry="8" transform="rotate(-55 312 420)"/>
  </g>

  <!-- Sword 1: Top-Left to Bottom-Right -->
  <g>
    <!-- Blade -->
    <polygon points="360,110 375,125 180,360 165,345" fill="url(#bladeGrad)" stroke="#64748b" stroke-width="3"/>
    <line x1="367" y1="117" x2="172" y2="352" stroke="#ffffff" stroke-width="3"/>
    <!-- Crossguard -->
    <rect x="135" y="325" width="60" height="12" rx="4" transform="rotate(45 165 331)" fill="url(#goldRim)" stroke="#78350f" stroke-width="2"/>
    <!-- Grip -->
    <rect x="145" y="360" width="14" height="40" rx="3" transform="rotate(45 152 380)" fill="#78350f"/>
    <!-- Pommel -->
    <circle cx="120" cy="410" r="14" fill="url(#goldRim)" stroke="#78350f" stroke-width="3"/>
  </g>

  <!-- Sword 2: Top-Right to Bottom-Left -->
  <g>
    <!-- Blade -->
    <polygon points="152,110 137,125 332,360 347,345" fill="url(#bladeGrad)" stroke="#64748b" stroke-width="3"/>
    <line x1="145" y1="117" x2="340" y2="352" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Crossguard -->
    <rect x="317" y="325" width="60" height="12" rx="4" transform="rotate(-45 347 331)" fill="url(#goldRim)" stroke="#78350f" stroke-width="2"/>
    <!-- Grip -->
    <rect x="353" y="360" width="14" height="40" rx="3" transform="rotate(-45 360 380)" fill="#78350f"/>
    <!-- Pommel -->
    <circle cx="392" cy="410" r="14" fill="url(#goldRim)" stroke="#78350f" stroke-width="3"/>
  </g>

  <!-- Center Crest Gem -->
  <circle cx="256" cy="235" r="16" fill="url(#goldRim)" stroke="#fef08a" stroke-width="3"/>
  <polygon points="256,170 266,190 288,193 272,208 276,230 256,219 236,230 240,208 224,193 246,190" fill="#fef08a"/>
</svg>

