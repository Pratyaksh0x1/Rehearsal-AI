<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%">
  <!-- Bronze: Simple bronze shield, plain, warm brown-copper metal -->
  <defs>
    <linearGradient id="bronzeShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b06d3b"/>
      <stop offset="50%" stop-color="#8d4e24"/>
      <stop offset="100%" stop-color="#5a2e12"/>
    </linearGradient>
    <linearGradient id="bronzeTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d99b66"/>
      <stop offset="50%" stop-color="#f4c090"/>
      <stop offset="100%" stop-color="#b06d3b"/>
    </linearGradient>
  </defs>
  <!-- Base Shield -->
  <path d="M256 60 L390 110 L370 330 C370 390 256 460 256 460 C256 460 142 390 142 330 L122 110 Z" fill="url(#bronzeShield)" stroke="url(#bronzeTrim)" stroke-width="14" stroke-linejoin="round"/>
  <!-- Inner Rim -->
  <path d="M256 90 L360 130 L345 315 C345 365 256 425 256 425 C256 425 167 365 167 315 L152 130 Z" fill="#6d3916" opacity="0.6"/>
  <!-- Chevron Accent -->
  <path d="M200 240 L256 290 L312 240" stroke="#f4c090" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M215 190 L256 230 L297 190" stroke="#d99b66" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Tier Stars/Dot -->
  <circle cx="256" cy="150" r="12" fill="#f4c090"/>
</svg>

