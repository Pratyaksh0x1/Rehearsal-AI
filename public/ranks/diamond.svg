<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%">
  <!-- Diamond: faceted cyan/blue crystal at center, sharp edges, glow -->
  <defs>
    <linearGradient id="diamShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="50%" stop-color="#164e63"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="crystalTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="crystalBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="diamGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Glow -->
  <circle cx="256" cy="256" r="140" fill="#06b6d4" opacity="0.3" filter="url(#diamGlow)"/>
  <!-- Diamond Sharp Wings -->
  <path d="M130 140 L10 160 L60 230 L5 260 L80 340 L160 300 Z" fill="#155e75" stroke="#67e8f9" stroke-width="6"/>
  <path d="M382 140 L502 160 L452 230 L507 260 L432 340 L352 300 Z" fill="#155e75" stroke="#67e8f9" stroke-width="6"/>
  <!-- Base Shield -->
  <path d="M256 40 L405 100 L380 340 C380 415 256 480 256 480 C256 480 132 415 132 340 L107 100 Z" fill="url(#diamShield)" stroke="#67e8f9" stroke-width="14" stroke-linejoin="round"/>
  <!-- Faceted Cyan Diamond Crystal at Center -->
  <polygon points="256,120 330,190 256,230 182,190" fill="url(#crystalTop)" stroke="#cffafe" stroke-width="5"/>
  <polygon points="182,190 256,230 256,360 182,190" fill="url(#crystalBottom)" stroke="#cffafe" stroke-width="4"/>
  <polygon points="330,190 256,230 256,360 330,190" fill="#0891b2" stroke="#cffafe" stroke-width="4"/>
  <!-- Crystal Sparkle Points -->
  <circle cx="256" cy="230" r="8" fill="#ffffff" filter="url(#diamGlow)"/>
  <circle cx="256" cy="120" r="5" fill="#ffffff"/>
  <circle cx="256" cy="360" r="5" fill="#ffffff"/>
</svg>

