<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%">
  <!-- Gold: Gold shield, small wings, polished shine -->
  <defs>
    <linearGradient id="goldShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="goldWings" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <!-- Small Wings -->
  <path d="M120 180 L50 200 L90 260 L40 280 L100 340 L160 300 Z" fill="url(#goldWings)" stroke="#fef08a" stroke-width="4"/>
  <path d="M392 180 L462 200 L422 260 L472 280 L412 340 L352 300 Z" fill="url(#goldWings)" stroke="#fef08a" stroke-width="4"/>
  <!-- Base Shield -->
  <path d="M256 60 L390 110 L370 330 C370 395 256 465 256 465 C256 465 142 395 142 330 L122 110 Z" fill="url(#goldShield)" stroke="#fef9c3" stroke-width="14" stroke-linejoin="round"/>
  <!-- Polished Shield Inner Cutout -->
  <path d="M256 90 L360 130 L345 315 C345 365 256 425 256 425 C256 425 167 365 167 315 L152 130 Z" fill="#854d0e" opacity="0.4"/>
  <!-- Polished Shine Slash -->
  <path d="M190 110 L290 85 L220 400 L170 370 Z" fill="#ffffff" opacity="0.25"/>
  <!-- Gold Crest -->
  <path d="M256 160 L290 220 L222 220 Z" fill="#fef9c3"/>
  <path d="M190 250 L256 310 L322 250" stroke="#fef08a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="256" cy="350" r="10" fill="#fef9c3"/>
</svg>

