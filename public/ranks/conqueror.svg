<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%">
  <!-- Conqueror: dark red/black and gold, large wings, flames or aura, crown and a central gem -->
  <defs>
    <linearGradient id="conqShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="40%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#090505"/>
    </linearGradient>
    <linearGradient id="conqGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="conqFlames" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="auraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Flame Aura Backdrop -->
  <path d="M256 0 C220 50 180 80 180 130 C150 120 120 160 140 210 C90 220 70 290 100 350 L256 460 L412 350 C442 290 422 220 372 210 C392 160 362 120 332 130 C332 80 292 50 256 0 Z" fill="url(#conqFlames)" opacity="0.3" filter="url(#auraGlow)"/>
  <!-- Grand Wings (Dark Red & Gold) -->
  <path d="M130 140 L0 150 L50 230 L-10 270 L60 340 L160 310 Z" fill="#450a0a" stroke="url(#conqGold)" stroke-width="8" stroke-linejoin="round"/>
  <path d="M382 140 L512 150 L462 230 L522 270 L452 340 L352 310 Z" fill="#450a0a" stroke="url(#conqGold)" stroke-width="8" stroke-linejoin="round"/>
  <!-- Central Shield -->
  <path d="M256 110 L410 165 L385 375 C385 440 256 500 256 500 C256 500 127 440 127 375 L102 165 Z" fill="url(#conqShield)" stroke="url(#conqGold)" stroke-width="16" stroke-linejoin="round"/>
  <!-- Conqueror Crown -->
  <path d="M175 125 L150 40 L210 80 L256 15 L302 80 L362 40 L337 125 Z" fill="url(#conqGold)" stroke="#fef08a" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="150" cy="35" r="7" fill="#ef4444"/>
  <circle cx="256" cy="12" r="9" fill="#ef4444"/>
  <circle cx="362" cy="35" r="7" fill="#ef4444"/>
  <!-- Central Crimson Gem -->
  <polygon points="256,220 310,280 256,360 202,280" fill="#dc2626" stroke="url(#conqGold)" stroke-width="8"/>
  <polygon points="256,240 290,280 256,340 222,280" fill="#f87171"/>
  <polygon points="256,260 275,280 256,310 237,280" fill="#ffffff" opacity="0.8"/>
  <!-- Golden Chevrons -->
  <path d="M175 370 L256 430 L337 370" stroke="url(#conqGold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>

