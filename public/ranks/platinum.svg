<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%">
  <!-- Platinum: silver-blue metal, larger wings, subtle glow -->
  <defs>
    <linearGradient id="platShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="35%" stop-color="#7dd3fc"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="platWings" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="platGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Glow Layer -->
  <path d="M256 70 L380 120 L350 320 C350 380 256 450 256 450 C256 450 162 380 162 320 L132 120 Z" fill="#38bdf8" opacity="0.25" filter="url(#platGlow)"/>
  <!-- Larger Wings -->
  <path d="M140 160 L30 180 L75 240 L15 270 L80 340 L160 300 Z" fill="url(#platWings)" stroke="#e0f2fe" stroke-width="5" stroke-linejoin="round"/>
  <path d="M372 160 L482 180 L437 240 L497 270 L432 340 L352 300 Z" fill="url(#platWings)" stroke="#e0f2fe" stroke-width="5" stroke-linejoin="round"/>
  <!-- Base Shield -->
  <path d="M256 50 L395 105 L375 330 C375 400 256 470 256 470 C256 470 137 400 137 330 L117 105 Z" fill="url(#platShield)" stroke="#e0f2fe" stroke-width="14" stroke-linejoin="round"/>
  <!-- Silver-Blue Insets -->
  <path d="M256 85 L365 125 L350 315 C350 370 256 430 256 430 C256 430 162 370 162 315 L147 125 Z" fill="#0f172a" opacity="0.35"/>
  <!-- Metallic Facet Center -->
  <polygon points="256,120 300,200 256,280 212,200" fill="#bae6fd" stroke="#ffffff" stroke-width="6"/>
  <polygon points="256,140 285,200 256,260 227,200" fill="#e0f2fe"/>
  <path d="M180 300 L256 360 L332 300" stroke="#bae6fd" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>

